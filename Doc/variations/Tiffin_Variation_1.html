      METADATA & JUSTIFICATION BLOCK
      - Variation File: Tiffin_Variation_1.html
      - Persona Profile: The Busy Tech Professional
      - Core Theme: Techie Fuel
      - Design Rationale Summary: To create a high-performance, efficient UI that feels like a tool. The design prioritizes clarity and speed, with a dark-mode native aesthetic to reduce eye strain and a high-contrast accent for interactive elements.
      - Key Primitive Decisions:
        - Color: A monochromatic dark theme (#1A1A1A, #282828) is used for focus, while a single electric blue accent (#00AFFF) draws attention to clickable actions, reflecting a modern tech aesthetic.
        - Typography: 'Inter' is a geometric sans-serif known for its exceptional readability on screens, reinforcing the theme of clarity and efficiency.
        - Interactivity: Snappy, near-instant transitions (0.15s) give the UI a responsive, high-performance feel, eliminating any perceived lag. All ornamental animations are removed.
    -->

    <style>
      :root {
        --bg-color: #1A1A1A;
        --surface-color: #282828;
        --text-color: #E0E0E0;
        --text-muted-color: #888888;
        --border-color: #333333;
        --accent-color: #00AFFF;
        --primary-color: #00AFFF;
        --secondary-color: #00AFFF;
      }

      html { scroll-behavior: smooth; }
      body {
        line-height: 1.6;
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }
      
      /* Reset Tailwind dark mode for this variation */
      .dark {
        --tw-bg-opacity: 1;
        background-color: var(--bg-color);
      }

      /* Base Overrides */
      .bg-light-background, .dark\:bg-dark-background { background-color: var(--bg-color) !important; }
      .bg-light-surface, .dark\:bg-dark-surface { background-color: var(--surface-color) !important; border: 1px solid var(--border-color); }
      .text-light-text, .dark\:text-dark-text { color: var(--text-color) !important; }
      .text-light-muted, .dark\:text-dark-muted { color: var(--text-muted-color) !important; }
      .text-secondary, .dark\:text-accent { color: var(--accent-color) !important; }
      
      /* Component Styling */
      .rounded-lg, .rounded-xl, .rounded-full, .rounded-md, .rounded-b-3xl {
        border-radius: 0 !important;
      }
      .shadow-lg, .shadow-md, .shadow-xl, .shadow-2xl {
        box-shadow: none !important;
      }

      /* Buttons & Links */
      a, button {
        transition: all 0.15s ease-out;
      }
      .bg-primary { background-color: var(--primary-color) !important; color: #000 !important; }
      .bg-primary:hover, .hover\:bg-primary-dark:hover { background-color: #008fcc !important; }
      .bg-secondary { background-color: var(--secondary-color) !important; }
      .text-primary, .hover\:text-primary:hover { color: var(--primary-color) !important; }
      a:hover { color: var(--accent-color); }
      
      /* Navbar */
      nav { background-color: var(--surface-color) !important; border-bottom: 1px solid var(--border-color); }
      
      /* Meal Card */
      .group:hover { transform: none !important; } /* Disable 3D tilt */
      
      /* Icons */
      svg { stroke-width: 1.5; }

      @keyframes blink-caret {
        from, to { border-color: transparent }
        50% { border-color: var(--accent-color); }
      }
      .blinking-cursor {
        border-right: .15em solid var(--accent-color);
        margin-left: .1em;
      }
       @keyframes pulse {
        50% { opacity: .5; }
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>

            },
            fontFamily: {
              sans: ['Lexend', 'sans-serif'],

            },
          }
        }
      }
    </script>
