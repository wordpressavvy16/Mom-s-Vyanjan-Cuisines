      - Variation File: Tiffin_Variation_2.html
      - Persona Profile: The Health-Conscious Fitness Enthusiast
      - Core Theme: FitBites
      - Design Rationale Summary: To create a clean, inspiring, and organic UI that motivates healthy choices. The design uses an airy layout, natural colors, and fluid animations to feel fresh and energetic.
      - Key Primitive Decisions:
        - Color: A light-mode native palette with leafy green (#28a745) and clean white evokes freshness and nature, while a vibrant coral accent (#FF7F50) adds a splash of energy to calls-to-action.
        - Typography: 'Nunito' is a humanist sans-serif with rounded terminals, which gives it a friendly, approachable, and less rigid feel, aligning with an organic theme.
        - Interactivity: Gentle, fluid animations (0.4s cubic-bezier) and a subtle "grow" effect on card hover provide a smooth, satisfying interaction that feels organic rather than mechanical.
    -->

    <style>
      :root {
        --bg-color: #FFFFFF;
        --surface-color: #F8F9FA;
        --text-color: #212529;
        --text-muted-color: #6c757d;
        --border-color: #DEE2E6;
        --accent-color: #FF7F50; /* Coral */
        --primary-color: #28a745; /* Leafy Green */
        --secondary-color: #28a745;
      }
      
      html { scroll-behavior: smooth; }
      body {
        line-height: 1.6;
        font-family: 'Nunito', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }
      
      /* Base Overrides */
      .bg-light-background { background-color: var(--bg-color) !important; }
      .dark\:bg-dark-background { background-color: var(--bg-color) !important; } /* Force light mode */
      .bg-light-surface, .dark\:bg-dark-surface { background-color: var(--surface-color) !important; border: 1px solid var(--border-color); }
      .text-light-text, .dark\:text-dark-text { color: var(--text-color) !important; }
      .text-light-muted, .dark\:text-dark-muted { color: var(--text-muted-color) !important; }
      .text-secondary, .dark\:text-accent { color: var(--primary-color) !important; }

      /* Component Styling */
      .rounded-lg, .rounded-xl, .rounded-md, .rounded-b-3xl {
        border-radius: 12px !important;
      }
      .rounded-full { border-radius: 9999px !important; }
      .shadow-lg, .shadow-md, .shadow-xl, .shadow-2xl {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
      }
      .hover\:shadow-2xl:hover {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08) !important;
      }

      /* Buttons & Links */
      a, button, .group {
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      .bg-primary { background-color: var(--accent-color) !important; }
      .bg-primary:hover, .hover\:bg-primary-dark:hover { background-color: #e66a3a !important; }
      .bg-secondary { background-color: var(--secondary-color) !important; }
      .bg-secondary:hover, .hover\:bg-secondary-dark:hover { background-color: #218838 !important; }
      .text-primary, .hover\:text-primary:hover { color: var(--accent-color) !important; }
      a:hover { color: var(--accent-color); }
      
      /* Meal Card Grow Effect */
      .group:hover {
        transform: scale(1.03) !important;
      }

      /* Icons */
      svg { fill: currentColor; } /* Soft, filled icons */
      
      @keyframes blink-caret {
        from, to { border-color: transparent }
        50% { border-color: var(--primary-color); }
      }
      .blinking-cursor {
        border-right: .15em solid var(--primary-color);
        margin-left: .1em;
      }
       @keyframes pulse {
        50% { opacity: .5; }
      }
    </style>
