      METADATA & JUSTIFICATION BLOCK
      - Variation File: Tiffin_Variation_5.html
      - Persona Profile: The Corporate Executive
      - Core Theme: Power Lunch
      - Design Rationale Summary: To create a premium, sophisticated, and professional UI that conveys exclusivity. The design uses a formal layout, a luxurious color palette, and elegant typography to provide a seamless, high-end experience.
      - Key Primitive Decisions:
        - Color: A muted and luxurious palette of navy blue (#001f3f) and grays, with a single metallic gold accent (#D4AF37), creates a sense of professionalism and exclusivity.
        - Typography: The elegant serif font 'Playfair Display' for headings establishes a formal, premium tone, while 'Roboto' for body text ensures professional clarity and readability.
        - Interactivity: Understated and graceful cross-fade transitions on hover provide an elegant user experience without being distracting, reflecting a professional and seamless interaction model.
    -->

    <style>
      :root {
        --bg-color: #F4F6F8; /* Light Gray */
        --surface-color: #FFFFFF;
        --text-color: #001f3f; /* Navy Blue */
        --text-muted-color: #6c757d;
        --border-color: #EAECEE; /* Hairline Border */
        --accent-color: #D4AF37; /* Metallic Gold */
        --primary-color: #001f3f; /* Navy Blue */
        --secondary-color: #D4AF37; /* Gold */
      }
      
      html { scroll-behavior: smooth; }
      body {
        line-height: 1.6;
        font-family: 'Roboto', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }
      h1, h2, h3, h4, .font-display {
        font-family: 'Playfair Display', serif;
      }
      
      /* Base Overrides */
      .bg-light-background, .dark\:bg-dark-background { background-color: var(--bg-color) !important; }
      .bg-light-surface, .dark\:bg-dark-surface { background-color: var(--surface-color) !important; }
      .text-light-text, .dark\:text-dark-text { color: var(--text-color) !important; }
      .text-light-muted, .dark\:text-dark-muted { color: var(--text-muted-color) !important; }
      .text-secondary { color: var(--primary-color) !important; }
      .dark\:text-accent, .text-primary { color: var(--accent-color) !important; }
      
      /* Layout & Spacing */
      section { padding-top: 5rem; padding-bottom: 5rem; }
      .container { max-width: 1200px; }

      /* Component Styling */
      .rounded-lg, .rounded-xl, .rounded-md, .rounded-b-3xl {
        border-radius: 4px !important;
      }
      .rounded-full { border-radius: 9999px !important; }
      .shadow-lg, .shadow-md, .shadow-xl, .shadow-2xl {
        box-shadow: none !important;
        border: 1px solid var(--border-color);
      }

      /* Buttons & Links */
      a, button {
        transition: all 0.4s ease;
      }
      .bg-primary { background-color: var(--primary-color) !important; color: white !important; }
      .bg-primary:hover, .hover\:bg-primary-dark:hover { background-color: #003366 !important; } /* Darker Navy */
      footer.bg-secondary { background-color: var(--primary-color) !important; color: white !important; }
      .hover\:text-primary:hover { color: var(--accent-color) !important; }
      .text-accent, .dark\:hover\:text-dark-accent:hover { color: var(--accent-color) !important; }
      
      /* Elegant hover for cards */
      .group:hover {
        border-color: var(--accent-color) !important;
        transform: translateY(-4px);
      }
      
      @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: inherit; } }
      .blinking-cursor { border-right: .15em solid; margin-left: .1em; }
       @keyframes pulse { 50% { opacity: .5; } }
    </style>
