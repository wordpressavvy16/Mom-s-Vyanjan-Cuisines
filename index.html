              'shimmer-slide': 'shimmerSlide 3s infinite',
              'shake': 'shake 300ms ease-out',
              'subtle-float': 'subtleFloat 3s ease-in-out infinite',
              'glare-effect': 'glareEffect 1s ease-in-out',
            },
            keyframes: {
                fadeInScale: {
                    'from': { opacity: 0, transform: 'scale(0.95)' },
                    'to': { opacity: 1, transform: 'scale(1)' },
                },
                slideUpFade: {
                    'from': { opacity: 0, transform: 'translateY(20px)' },
                    'to': { opacity: 1, transform: 'translateY(0)' },
                },
                imageReveal: {
                    'from': { 'clip-path': 'inset(0 50% 0 50%)' },
                    'to': { 'clip-path': 'inset(0 0 0 0)' },
                },
                fadeInPulse: {
                    'from': { opacity: 0, transform: 'scale(0.9)' },
                    'to': { opacity: 1, transform: 'scale(1)' },
                },
                subtlePulse: {
                    '0%, 100%': { opacity: 0, transform: 'scale(1)' },
                    '50%': { opacity: 0.3, transform: 'scale(1.05)' },
                },
                badgePop: {
                    '0%': { transform: 'scale(1)' },
                    '50%': { transform: 'scale(1.3)' },
                    '100%': { transform: 'scale(1)' },
                },
                badgeGlow: {
                    '0%, 100%': { 'box-shadow': '0 0 0 0 rgba(255, 107, 53, 0.7)' },
                    '50%': { 'box-shadow': '0 0 0 8px rgba(255, 107, 53, 0)' },
                },
                shimmerSlide: {
                    '0%': { transform: 'translateX(-100%)' },
                    '100%': { transform: 'translateX(100%)' },
                },
                shake: {
                    '0%, 100%': { transform: 'translateX(0)' },
                    '25%': { transform: 'translateX(-5px)' },
                    '75%': { transform: 'translateX(5px)' },
                },
                subtleFloat: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-3px)' },
                },
                glareEffect: {
                    '0%': { transform: 'translateX(-150%) skewX(-25deg)', opacity: '0.2' },
                    '100%': { transform: 'translateX(150%) skewX(-25deg)', opacity: '0' },
                },
            }
          }
        }
      }
